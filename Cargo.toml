[package]
name = "pygamest-dev"
version = "0.1.10"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "pygamest-dev —— pygame 的 python（开发解释器）：pygame 全内置、零 Rust 工具链"

[lib]
# 库 = 宿主运行时（host trait / runtime / platform 各实现）——桌面 bin 与
# Android 调试壳 example 共用
name = "pygamest_dev"
path = "src/lib.rs"

[[bin]]
# 产物名 = python（用户定夺：开发解释器的分发形态就是 python.exe——
# pygame 全内置的 python 发行版；项目/仓库名 = pygamest-dev）
name = "python"
path = "src/main.rs"

[[example]]
# Android 调试壳（cdylib）：dialog 选文件运行（单文件 -c 形态）
name = "android_host"
path = "examples/android_host.rs"
crate-type = ["cdylib"]

[features]
# 能力轴透传（对齐 pygamest 同名轴——本仓不新增语义）。
# default = 开发解释器基准形态（gui + physics2d/3d + ozz）；spine/live2d
# **退出 default**——资产依赖重 + Live2D IP 许可敏感，按需
# `--features spine,live2d` 显式叠加（未启用 = 对应 Python 子模块
# 不存在，import 即 AttributeError——能力轴裁剪定约）。生产壳
# （pygamest-runtime）以 default-features = false 消费本仓，只取所需
# 轴——不带 full = 生产保留裁剪版 stdlib（freeze 白名单，exe -32%
# 批次的战果）。
# ⚠️ ozz 入 default：上游 ozz-animation-rs 用 std::simd——本仓默认
# 构建**须 nightly 工具链**（`cargo +nightly build`；stable 构建会在
# ozz 依赖树报 core::simd 错，属预期）。
# full **退出 default**（2026-11-08 定约）："独立 RustPython 承担打包"
# 路线暂缓——默认走 Lib_min 白名单裁剪版 stdlib（time/sys = RP 内建
# 原生模块不依赖冻结；当前项目零影响，-23MB 级）。full 保留为 opt-in
# （编辑器工具链面），后续 RP 可替代 CPython 时再补回。
default = ["gui", "physics2d", "physics3d", "ozz"]
full = ["pygamest/stdlib-full"]
gui = ["pygamest/gui"]
physics2d = ["pygamest/physics2d"]
physics3d = ["pygamest/physics3d"]
spine = ["pygamest/spine"]
live2d = ["pygamest/live2d"]
# click-through = 鼠标事件穿透（桌宠形态配套；Win32 实装——透传链
# click-through → pygamest/click-through → starfish-pygame/click-through
# → starfish-we/click-through；未启用 = pygame.display 两口不存在）
click-through = ["pygamest/click-through"]
# skip-taskbar = 任务栏（Dock）隐藏（桌宠配套；Win32/macOS 实装，
# Linux Wayland 站桩——透传链同上；未启用 = pygame.display 两口不存在）
skip-taskbar = ["pygamest/skip-taskbar"]
# tray = 系统托盘（桌宠配套；三桌面实装——透传链同上；未启用 =
# pygame.display 两口 + 事件三常量不存在）
tray = ["pygamest/tray"]
# ozz = 3D 骨骼动画（已入 default——见上 ⚠️ nightly 工具链说明）
ozz = ["pygamest/ozz"]

[dependencies]
starfish-debug = { git = "https://github.com/GuYeying/starfish" }
# 核心库（绑定面 + 宿主）：能力轴由本仓 [features] 透传驱动（不在此
# 硬编码——生产壳以 default-features = false 消费本仓时可裁轴）
pygamest = { git = "https://github.com/GuYeying/pygamest", default-features = false }
# 事件泵/混音器驱动（脚本直跑的游戏门帧循环用）
starfish-pygame = { git = "https://github.com/GuYeying/starfish" }
# 开发辅助（app_entry! 跨平台入口宏；we = Android android_main 装配）
starfish-std = { git = "https://github.com/GuYeying/starfish", features = ["we"] }


# ── Web 宿主（platform/web.rs；版本与 Cargo.lock 严格一致——
# wasm-bindgen-cli 校验同规）──
starfish-io = { git = "https://github.com/GuYeying/starfish" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["Window", "Location"] }
starfish-io = { git = "https://github.com/GuYeying/starfish" }

# ── 移动宿主（platform/mobile.rs 的 dialog 载荷通道；robius-file-picker
#     实现，Android 构建前置 ANDROID_JAR 环境变量）──
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
starfish-dialog = { git = "https://github.com/GuYeying/starfish" }

# ── 内存泄漏排查 harness（leak_harness.rs 的 RSS 采样；开发壳专属）──
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

# ── Android 宿主（嵌入模式 JNI 面 + android_host 独立运行入口）──
[target.'cfg(target_os = "android")'.dependencies]
starfish-we = { git = "https://github.com/GuYeying/starfish", features = ["embedded"] }
starfish-io = { git = "https://github.com/GuYeying/starfish" }
jni-sys = "0.3"
android-activity = "0.6"
# 嵌入形态由宿主经 JNI 导出注入（nativeInitContext）——cpal/robius 等
# JNI 消费方读同一静态；无 glue 时无人初始化，脚本一碰音频即 panic
#（真机实证）；版本须与依赖树现存严格一致（单实例归一）
ndk-context = "0.1.1"

[profile.release]
strip = true

# vello_common 0.2.0 strip 光栅化 NaN 防御（vendor 源在 pygamest 仓——
# 详注见 pygamest Cargo.toml [patch.crates-io]）
[patch.crates-io]
vello_common = { path = "../pygame-rs/vendor/vello_common" }
